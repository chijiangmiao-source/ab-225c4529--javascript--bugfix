server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA assets.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    # Real backend API, reverse-proxied inside the compose network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    # Backend health endpoint, so the web container health check covers
    # the full proxy path to the audit service.
    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
